name: coolproof
x-runtime: &runtime
  env_file: ["${COOLPROOF_RUNTIME_ENV_FILE:-.env}"]
  restart: unless-stopped
  networks: [private]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    image: coolproof-api:latest
    <<: *runtime
    environment: { OTEL_SERVICE_NAME: coolproof-api, OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317 }
    expose: ["8000"]
    depends_on: { otel-collector: { condition: service_started } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"], interval: 30s, timeout: 5s, retries: 3 }
  worker:
    image: coolproof-api:latest
    <<: *runtime
    environment: { OTEL_SERVICE_NAME: coolproof-worker, OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317 }
    command: ["python", "-m", "app.worker"]
    depends_on: { otel-collector: { condition: service_started } }
  langgraph:
    image: coolproof-api:latest
    <<: *runtime
    environment: { OTEL_SERVICE_NAME: coolproof-langgraph, OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317 }
    command: ["python", "-m", "app.langgraph_runtime"]
    depends_on: { otel-collector: { condition: service_started } }
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    ports: ["80:80", "443:443"]
    environment: { CADDY_EMAIL: "${CADDY_EMAIL}", COOLPROOF_API_DOMAIN: "${COOLPROOF_API_DOMAIN}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "./frontend:/srv/frontend:ro", "caddy_data:/data", "caddy_config:/config"]
    networks: [private, edge]
    security_opt: [no-new-privileges:true]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    environment: { AWS_REGION: "${AWS_REGION:-us-east-2}" }
    networks: [private]
    expose: ["4317", "4318"]
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    networks: [private]
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment: { GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password, GF_USERS_ALLOW_SIGN_UP: "false", GF_AUTH_ANONYMOUS_ENABLED: "false" }
    secrets: [grafana_admin_password]
    volumes: ["grafana_data:/var/lib/grafana", "./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"]
    networks: [private]
networks:
  edge: {}
  # Services are not published on host ports; allowing egress here is
  # required for private RDS/ElastiCache endpoints and AWS APIs.
  private: {}
volumes:
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  grafana_data: {}
secrets:
  grafana_admin_password: { file: "${GRAFANA_ADMIN_PASSWORD_FILE:-./deploy/secrets/grafana_admin_password}" }
